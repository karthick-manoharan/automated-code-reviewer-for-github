name: Code Reviewer

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: ./.github/actions/reviewer

      - name: Build action
        run: npm run build
        working-directory: ./.github/actions/reviewer

      - name: Run Reviewer Action
        uses: ./.github/actions/reviewer
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          prompt-file-path: 'review-prompt.md'
